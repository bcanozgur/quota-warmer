name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: QuotaWarmer
  SCHEME: QuotaWarmer

jobs:
  build:
    name: Generate Project and Build
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check localizations
        # Every String Catalog key needs a finished Turkish translation with the
        # same format placeholders as the English key.
        run: python3 scripts/check-localizations.py

      - name: Run regression suites
        # Package.swift compiles the app's Models/Services in place; the three
        # suites in Tests/RegressionTests run as one serialized Swift Testing suite.
        run: swift test

      - name: Build Debug
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -derivedDataPath /tmp/QuotaWarmerCIDerivedData \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -derivedDataPath /tmp/QuotaWarmerCIReleaseDerivedData \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
